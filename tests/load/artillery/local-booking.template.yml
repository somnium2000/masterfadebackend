config:
  target: "http://127.0.0.1:3102"
  processor: "../local-booking.processor.cjs"
  phases:
    - duration: 1
      arrivalCount: __VUS__
      name: "Crear __VUS__ VU concurrentes"
  defaults:
    headers:
      accept: "application/json"
  plugins:
    expect: {}
scenarios:
  - name: "Hold real y actividad sostenida"
    beforeScenario: "assignSyntheticBooking"
    afterScenario: "recordVuserExit"
    flow:
      - post:
          url: "/v1/public/citas/hold"
          headers:
            content-type: "application/json"
            x-idempotency-key: "{{ idempotencyKey }}"
          json:
            id_sucursal: "11111111-1111-4111-8111-111111111111"
            titular:
              nombre: "Artillery Sintetico"
              email: "{{ email }}"
              telefono: "99990000"
            id_barbero: "33333333-3333-4333-8333-333333333333"
            fecha_inicio: "{{ startAt }}"
            selection_type: "services"
            servicios:
              - id_servicio: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          expect:
            - statusCode: 201
      - loop:
          - get:
              url: "/v1/health/live"
              expect:
                - statusCode: 200
          - get:
              url: "/v1/public/citas/contexto"
              expect:
                - statusCode: 200
          - think: 5
        count: __LOOPS__
